
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fractales-python"
version = "0.1.0"
description = "Generateur de fractales de Mandelbrot"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
